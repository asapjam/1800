<html>
    <head>
        <script src="products_page.js" type="module"></script>
        <link rel="stylesheet" href="products_page.css">
    </head>
    <body>
        <h1>Products:</h1>

        <ul name="products_list"></ul>

        <form id="createNewProductButton">
            <button type="button" id="createNewProduct">Create New Product</button>
        </form>
        
        <div id="createNewProductDiv">
            <h2>Create a Product!</h2>
            <form id="createNewProductForm">
                <label for="name">Name: </label>
                <input name="name" type="text"/>

                <label for="price">Price: </label>
                <input name="price" type="number"/>

                <label for="inventory">Inventory: </label>
                <input name="inventory" type="number"/>

                <button type="submit">Submit</button>
            </form>
        </div>
    </body>
</html>
