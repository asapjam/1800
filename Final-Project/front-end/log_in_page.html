<html>

<head>
    <script src="log_in_page.js" type="module"></script>
    <link rel="stylesheet" href="log_in_page.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="log_in_page.html" id="logInLink">Account</a>
        <a href="products_page.html">Products</a>
    </nav>
    <p id="pageFeedback"> </p>

    <div id="logOutDiv"></div>

    <div id="createNewUser">

        <form id="createNewUserButton">
            <button type="button">Create an account!</button>
        </form>

        <div id="createNewUserDiv">
            <h2>Create an account!</h2>
            <form id="createNewUserForm">
                <label for="username">Username: </label>
                <input name="username" type="text" minlength="5" required />

                <label for="password">Password: </label>
                <input name="password" type="password" minlength="5" required />

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <div id="logIn">
        <form id="logInButton">
            <button type="button">Have an account? Log in!</button>
        </form>

        <div id="logInDiv">
            <h2>Log in to an account!</h2>
            <form id="logInForm">
                <label for="username">Username: </label>
                <input name="username" type="text" minlength="5" required />

                <label for="password">Password: </label>
                <input name="password" type="password" minlength="5" required />

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

</body>

</html>
